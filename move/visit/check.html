<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새 집 상태 점검</title>
<!-- 10/24 가족 요청으로 간단하게 다시 만듦. 값은 이 휴대폰(localStorage 'mv:check:v2')에만 저장 — '결과 복사'로 보내요. -->
<style>
:root {
  --bg:#f6f4ef; --bg-2:#ffffff; --bg-3:#eeeae1; --ink:#21201d; --ink-2:#57534e; --ink-3:#78726a;
  --line:#e2ddd3; --line-2:#cfc8ba; --brand:#c2410c; --kid:#0e7490; --kid-bg:#e6f4f7;
  --good:#15803d; --good-bg:#e7f4ec; --bad:#b91c1c; --bad-bg:#fdeceb; --on-brand:#ffffff;
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#16151a; --bg-2:#1f1e24; --bg-3:#2a2830; --ink:#f0ede8; --ink-2:#b9b3ab; --ink-3:#9c968e;
  --line:#33313a; --line-2:#45424d; --brand:#fb923c; --kid:#67e8f9; --kid-bg:#10333c;
  --good:#6ee7a8; --good-bg:#123324; --bad:#fca5a5; --bad-bg:#3a1a1a; --on-brand:#2a1200; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#16151a; --bg-2:#1f1e24; --bg-3:#2a2830; --ink:#f0ede8; --ink-2:#b9b3ab; --ink-3:#9c968e;
  --line:#33313a; --line-2:#45424d; --brand:#fb923c; --kid:#67e8f9; --kid-bg:#10333c;
  --good:#6ee7a8; --good-bg:#123324; --bad:#fca5a5; --bad-bg:#3a1a1a; --on-brand:#2a1200; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 640px; margin: 0 auto; padding: 12px 16px 110px; }
a { color: var(--kid); }
.top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
h1 { font-size: 1.35rem; margin: 8px 0 4px; }
.sum { display: flex; gap: 8px; margin: 10px 0; }
.sum div { flex: 1; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.sum b { display: block; font-size: 1.4rem; }
.sum .bad b { color: var(--bad); }
.sum .good b { color: var(--good); }
h2 { font-size: .95rem; color: var(--ink-2); margin: 18px 0 6px; }
.row { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 8px 0; }
.row.is-ok { border-color: var(--good); }
.row.is-bad { border-color: var(--bad); background: var(--bad-bg); }
.head { display: flex; align-items: center; gap: 10px; }
.txt { flex: 1; min-width: 0; }
.ttl { font-weight: 700; }
.hint { font-size: .85rem; color: var(--ink-3); }
.btns { display: flex; gap: 6px; flex: 0 0 auto; }
.b { min-width: 52px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--bg); color: var(--ink); font: inherit; font-weight: 700; font-size: .9rem; cursor: pointer; padding: 0 8px; }
.b.ok[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--on-brand); }
.b.no[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--on-brand); }
.memo { width: 100%; margin-top: 8px; min-height: 44px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; font-size: .95rem; padding: 8px 10px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg-2); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; justify-content: center; }
.bar button { flex: 1; max-width: 240px; min-height: 48px; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink); }
.bar .primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
#copybox { display: none; width: 100%; min-height: 150px; margin-top: 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink); font: inherit; font-size: .9rem; padding: 8px; }
#copybox.on { display: block; }
.confirm { display: none; background: var(--bad-bg); border-radius: 12px; padding: 10px; margin-top: 10px; }
.confirm.on { display: block; }
.confirm button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink); font: inherit; font-weight: 700; padding: 0 14px; margin: 6px 6px 0 0; cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .92rem; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../index.html#/">← 이사 앱으로</a><a href="./measure.html">실측 페이지 →</a></div>
  <h1>새 집 상태 점검</h1>
  <div class="sum">
    <div><b id="n-done">0/0</b><span>확인</span></div>
    <div class="bad"><b id="n-bad">0</b><span>문제</span></div>
  </div>
  <div id="list"></div>
  <textarea id="copybox" readonly aria-label="복사할 결과"></textarea>
  <div class="confirm" id="confirm">이 휴대폰에 적은 점검 결과를 모두 지울까요?<br>
    <button type="button" id="yes">모두 지우기</button><button type="button" id="no">그만두기</button></div>
</div>
<div class="bar"><button class="primary" id="copy" type="button">결과 복사</button><button id="clear" type="button">다 지우기</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var KEY = 'mv:check:v2';
  var GROUPS = [
    { name: '꼭 물어볼 것', ok: '정했어요', no: '아직', items: [
      ['clean', '입주청소', '누가 하나요? 우리가 하면 언제 들어갈 수 있나요?'],
      ['rent', '첫 월세일', '10/24 확정 — 후불, 첫 월세 12/3 (11/3엔 안 내요). 문자로 받았는지만 확인'],
      ['revisit', '2차 방문 날짜', '수리 뒤 빈집을 한 번 더 볼 날'],
    ] },
    { name: '보고 확인할 것', ok: '좋아요', no: '문제', items: [
      ['mold', '곰팡이', '창틀 · 욕실 천장 · 벽 모서리'],
      ['leak', '누수', '천장 얼룩 · 싱크대 아래 · 바닥'],
      ['water', '수압 · 온수', '주방과 욕실 물을 같이 틀어 보기'],
      ['toilet', '변기', '물 내림 · 물 샘 · 흔들림'],
      ['sink', '싱크대', '물 빠짐 · 하부장 물 자국 · 수전'],
      ['induction', '인덕션 자리', '가스레인지 대신 · 220V 콘센트 있는지'],
      ['window', '창 · 방충망', '열고 닫기 · 잠금 · 찢어짐'],
      ['power', '전기', '차단기 위치 · 콘센트 · 전등'],
      ['doorlock', '도어락 · 열쇠', '작동 · 비밀번호 바꾸는 법'],
    ] },
  ];
  var S = {};
  try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 저장이 막힌 브라우저 */ } }
  function $(s) { return document.querySelector(s); }
  var all = [];
  function render() {
    var box = $('#list');
    box.innerHTML = '';
    all = [];
    GROUPS.forEach(function (g) {
      var h2 = document.createElement('h2'); h2.textContent = g.name; box.appendChild(h2);
      g.items.forEach(function (it) {
        var id = it[0]; all.push({ id: id, name: it[1], g: g });
        var st = S[id] = S[id] || {};
        var row = document.createElement('div'); row.className = 'row';
        var head = document.createElement('div'); head.className = 'head';
        var txt = document.createElement('div'); txt.className = 'txt';
        txt.innerHTML = '<div class="ttl"></div><div class="hint"></div>';
        txt.firstChild.textContent = it[1]; txt.lastChild.textContent = it[2];
        var btns = document.createElement('div'); btns.className = 'btns';
        var bOk = document.createElement('button'); bOk.type = 'button'; bOk.className = 'b ok'; bOk.textContent = g.ok;
        var bNo = document.createElement('button'); bNo.type = 'button'; bNo.className = 'b no'; bNo.textContent = g.no;
        var memo = document.createElement('input'); memo.className = 'memo'; memo.placeholder = g.ok === '정했어요' ? '답 적기 (예: 11/1 우리가 청소)' : '어디·어떻게 (사진도 찍어요)'; memo.value = st.memo || '';
        memo.setAttribute('aria-label', it[1] + ' 메모');
        function paint() {
          bOk.setAttribute('aria-pressed', String(st.v === 'ok'));
          bNo.setAttribute('aria-pressed', String(st.v === 'no'));
          row.classList.toggle('is-ok', st.v === 'ok');
          row.classList.toggle('is-bad', st.v === 'no');
          memo.hidden = !(st.v === 'no' || st.memo || id === 'clean' || id === 'rent' || id === 'revisit');
          count();
        }
        bOk.addEventListener('click', function () { st.v = st.v === 'ok' ? '' : 'ok'; save(); paint(); });
        bNo.addEventListener('click', function () { st.v = st.v === 'no' ? '' : 'no'; save(); paint(); if (st.v === 'no') memo.focus(); });
        memo.addEventListener('input', function () { st.memo = memo.value; save(); });
        btns.appendChild(bOk); btns.appendChild(bNo);
        head.appendChild(txt); head.appendChild(btns);
        row.appendChild(head); row.appendChild(memo);
        box.appendChild(row);
        paint();
      });
    });
  }
  function count() {
    var done = 0, bad = 0;
    all.forEach(function (a) { var v = (S[a.id] || {}).v; if (v) done++; if (v === 'no') bad++; });
    $('#n-done').textContent = done + '/' + all.length;
    $('#n-bad').textContent = bad;
  }
  function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2200); }
  function text() {
    var lines = ['[새 집 상태 점검 — ' + new Date().toLocaleDateString('ko-KR') + ']'];
    var bad = all.filter(function (a) { return (S[a.id] || {}).v === 'no'; });
    if (bad.length) { lines.push('', '■ 문제·아직'); bad.forEach(function (a) { lines.push('- ' + a.name + (S[a.id].memo ? ': ' + S[a.id].memo : '')); }); }
    lines.push('', '■ 전체');
    all.forEach(function (a) { var st = S[a.id] || {}; lines.push('- ' + a.name + ': ' + (st.v === 'ok' ? a.g.ok : st.v === 'no' ? a.g.no : '안 봄') + (st.memo ? ' (' + st.memo + ')' : '')); });
    return lines.join('\n');
  }
  $('#copy').addEventListener('click', function () {
    var t = text(), box = $('#copybox');
    box.value = t;
    function fallback() { box.classList.add('on'); box.focus(); box.select(); toast('글을 길게 눌러 복사해 주세요'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('복사했어요'); }, fallback); else fallback();
  });
  $('#clear').addEventListener('click', function () { $('#confirm').classList.add('on'); $('#confirm').scrollIntoView({ behavior: 'smooth' }); });
  $('#no').addEventListener('click', function () { $('#confirm').classList.remove('on'); });
  $('#yes').addEventListener('click', function () { S = {}; save(); $('#confirm').classList.remove('on'); render(); toast('지웠어요'); });
  render();
})();
</script>
</body>
</html>
